<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>フィッシュハンター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed; inset: 0;
    background: #0a3d62;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    color: #fff;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  canvas.holding { cursor: none; }

  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
    background: linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,0));
    pointer-events: none;
    font-weight: bold;
    font-size: clamp(16px, 4.2vw, 24px);
    text-shadow: 0 2px 4px rgba(0,0,0,.6);
    z-index: 4;
  }
  #hud .label { font-size: .7em; opacity: .85; margin-right: 6px; }
  .poiInfo { display: flex; align-items: center; flex: 1; min-width: 0; max-width: 360px; }
  #gauge {
    position: relative; flex: 1; min-width: 80px;
    height: 16px; margin: 0 8px;
    border-radius: 8px;
    background: rgba(255,255,255,.2);
    border: 2px solid rgba(255,255,255,.75);
    overflow: hidden;
  }
  #gaugeFill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
    background: #2ecc71;
    transition: width .3s ease, background-color .3s;
  }
  #gauge.shake { animation: shake .35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  #durability { min-width: 3.2em; text-align: right; font-size: .85em; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(4, 22, 40, .6);
    z-index: 3;
    padding: calc(60px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }
  .overlay.hidden { display: none; }
  .panel {
    width: min(420px, 100%);
    max-height: 100%; overflow-y: auto;
    background: rgba(255,255,255,.96);
    color: #123;
    border-radius: 20px;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .panel h1 { font-size: clamp(26px, 7vw, 34px); color: #0a3d62; margin-bottom: 8px; }
  .panel h2 { font-size: clamp(24px, 6.5vw, 30px); color: #c0392b; margin-bottom: 6px; }
  .panel p { font-size: 15px; line-height: 1.6; margin-bottom: 14px; color: #345; }
  .final { font-size: clamp(40px, 12vw, 56px); font-weight: bold; color: #0a3d62; margin: 6px 0 4px; }
  .best { font-size: 14px; color: #678; margin-bottom: 18px; }
  .legend { list-style: none; margin: 20px auto 0; text-align: left; display: inline-block; font-size: 14px; }
  .legend li { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .legend canvas { position: static; width: 48px; height: 28px; cursor: default; flex: none; }
  .legend small { color: #c0392b; }
  .legend .need { font-size: 12px; color: #567; }
  .legend .need svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 2px; }
  button {
    display: block; width: 100%;
    min-height: 60px;
    font-size: 22px; font-weight: bold;
    color: #fff;
    background: linear-gradient(#ff9f43, #ee5a24);
    border: none; border-radius: 14px;
    box-shadow: 0 5px 0 #b33e12;
    cursor: pointer;
    touch-action: manipulation;
    font-family: inherit;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b33e12; }
  button:disabled { opacity: .45; cursor: default; }
  button.sub { min-height: 48px; font-size: 17px; margin-top: 10px; background: linear-gradient(#74b9ff, #0984e3); box-shadow: 0 5px 0 #065a9e; }
  button.sub:active { box-shadow: 0 2px 0 #065a9e; }

  .hudRight { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .wallet { font-size: 17px; font-weight: bold; color: #b7791f; margin-bottom: 6px; }
  .poiNote { font-size: 13px; color: #567; margin-bottom: 16px; }
  .poiNote svg { width: 22px; height: 22px; vertical-align: -6px; }

  /* 画面下中央のポイアイコンと、10段階のポイ選択 */
  #poiPicker {
    position: absolute; left: 0; right: 0; z-index: 5;
    bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
  }
  #poiBtn {
    pointer-events: auto; touch-action: none;
    width: 64px; height: 64px; min-height: 64px; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.7);
    box-shadow: none; font-size: 11px; line-height: 1.1;
  }
  #poiBtn:active { transform: scale(.94); box-shadow: none; }
  #poiBtn svg { width: 34px; height: 34px; }
  /* ポイを出している間はアイコンがキャンセル場所になる */
  #poiBtn .cancelIcon { display: none; font-size: 26px; line-height: 1; }
  #poiPicker.cancelMode #poiBtn { background: rgba(192,57,43,.55); border-color: #fff; transition: transform .1s, background-color .1s; }
  #poiPicker.cancelMode #poiBtn > span { display: none; }
  #poiPicker.cancelMode #poiBtn .cancelIcon { display: block; }
  #poiPicker.cancelMode #poiBtn .cancelLabel { display: block; font-size: 10px; font-weight: bold; }
  #poiPicker.overCancel #poiBtn { background: #e74c3c; transform: scale(1.25); }
  #palette {
    pointer-events: auto; touch-action: none;
    width: min(calc(100% - 16px), 340px); margin-bottom: 8px; padding: 6px 6px 4px;
    background: rgba(255,255,255,.94); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
    color: #123; text-align: center;
  }
  #palette .head { font-size: 12px; font-weight: bold; color: #0a3d62; margin-bottom: 2px; }
  #palette .row { display: flex; gap: 4px; }
  .poiOpt {
    flex: 1; min-width: 0; padding: 4px 0 3px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center;
    font-size: 12px; font-weight: bold; color: #345;
    transition: transform .08s, background-color .08s;
  }
  .poiOpt svg { width: 100%; max-width: 48px; height: auto; }
  .poiOpt.sel { background: #d6ecff; }
  .poiOpt.hover { background: #ffe8a3; transform: translateY(-5px) scale(1.12); }
  .poiOpt.cant { opacity: .35; }

  /* ポーズ */
  #pauseBtn {
    position: absolute; z-index: 5;
    left: calc(12px + env(safe-area-inset-left)); bottom: calc(20px + env(safe-area-inset-bottom));
    width: 46px; height: 46px; min-height: 46px; padding: 0;
    font-size: 18px; line-height: 1; border-radius: 50%;
    background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.7); box-shadow: none;
  }
  #pauseBtn:active { transform: scale(.92); box-shadow: none; }
  .setting { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-size: 16px; font-weight: bold; }
  .setting button { width: 110px; min-height: 42px; font-size: 16px; background: linear-gradient(#74b9ff, #0984e3); box-shadow: 0 4px 0 #065a9e; }
  .setting button.off { background: linear-gradient(#b2bec3, #7f8c8d); box-shadow: 0 4px 0 #5d6d6e; }
</style>
<canvas id="game"></canvas>

<div id="hud">
  <div class="poiInfo">
    <span class="label">ポイ</span>
    <div id="gauge"><div id="gaugeFill"></div></div>
    <span id="durability">100%</span>
  </div>
  <div class="hudRight">
    <div><span class="label">スコア</span><span id="score">0</span></div>
    <div>🪙<span id="coins">0</span></div>
  </div>
</div>


<div id="poiPicker" hidden>
  <div id="palette" hidden>
    <div class="head" id="paletteHead">次のポイを選ぶ</div>
    <div class="row" id="paletteRow"></div>
  </div>
  <button id="poiBtn" aria-label="ポイを変更(長押し・右クリック)"><span id="poiBtnIcon"></span><span id="poiBtnPrice"></span><b class="cancelIcon">✕</b><b class="cancelIcon cancelLabel">キャンセル</b></button>
</div>

<button id="pauseBtn" aria-label="ポーズ" hidden>⏸</button>

<div id="startScreen" class="overlay">
  <div class="panel">
    <h1>🎣 フィッシュハンター</h1>
    <p><b>長押し</b>でポイを出し、魚の上で<b>離す</b>とすくえます。<br>
       やめる時は画面下の✕まで運んで離す。<br>
       魚は<b>ポイから逃げる</b>ので素早く!<br>
       ポイが破れたら同じポイを自動で買って続行。<br>
       魚をすくって<b>コインを増やそう</b>。<br>
       <b>からぶりすると一発で破れる!</b><br>
       コインが尽きたら終わり。</p>
    <div class="wallet">手持ち 🪙<span id="walletCoins">0</span></div>
    <div class="poiNote">使うポイ:<span id="titlePoi"></span><br>
      画面下のアイコンを長押し(PCは右クリック)で変更</div>
    <button id="startBtn">スタート</button>
    <ul class="legend" id="legend"></ul>
  </div>
</div>

<div id="pauseScreen" class="overlay hidden">
  <div class="panel">
    <h2 style="color:#0a3d62">ポーズ</h2>
    <button id="resumeBtn" style="margin:12px 0 14px">再開</button>
    <div class="setting"><span>🔊 音</span><button id="soundToggle"></button></div>
    <div class="setting"><span>📳 振動</span><button id="vibeToggle"></button></div>
    <button id="quitBtn" class="sub">ゲームを終了(スコア確定)</button>
  </div>
</div>

<div id="endScreen" class="overlay hidden">
  <div class="panel">
    <h2 id="endTitle">ゲーム終了</h2>
    <div id="scoreBlock">
      <p style="margin-bottom:0">あなたのスコア</p>
      <div class="final" id="finalScore">0</div>
    </div>
    <div class="best" id="bestScore"></div>
    <div class="wallet" id="endWallet"></div>
    <button id="retryBtn">新しいゲーム</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ===== 設定 =====
  const FISH_COUNT = 14;
  const POI_BASE_RADIUS = 44;  // ポイの半径(画面サイズに応じて拡縮)
  const SCOOP_WEAR = 3;        // すくうたびに必ず減る耐久度(空振りでも水で弱る)
  const MISS_DAMAGE = 100;     // からぶりすると、どのポイでも一発で破れる

  // コイン
  const START_COINS = 100;
  const POI_PRICES = [10, 40, 70, 100]; // 買えるポイ(緑・青・銀・金)
  const PRICE_MIN = POI_PRICES[0];
  const COINS_KEY = 'fishHunterCoins2'; // 初期コイン100の新ルール(旧データは引き継がない)
  // 金のキンギョ:定期的に訪れ、しばらくすると去る
  const GOLD_VISIT_MIN = 20, GOLD_VISIT_RAND = 15; // 次に来るまでの秒数(20〜35秒)
  const GOLD_STAY_MIN = 10, GOLD_STAY_RAND = 5;    // 滞在する秒数(10〜15秒)
  const SEL_KEY = 'fishHunterPoiPrice'; // 選択中のポイ
  // ポイの値段→ダメージ倍率(高いポイほど破れにくい。50コインで1倍)
  // 魚のコインは、どのポイでもミスなしなら値段の約1.8倍、1回ミスでもプラス、2回ミスでほぼマイナスになるよう調整
  function damageMul(price) { return Math.pow(50 / price, 0.8); }
  // ポイの値段→格(0:緑 1:青 2:銀 3:金)
  const TIER_NAMES = ['緑', '青', '銀', '金'];
  function poiTier(price) { return price >= 100 ? 3 : price >= 70 ? 2 : price >= 40 ? 1 : 0; }
  // ポイの値段→枠と持ち手の色
  function poiColor(price) {
    if (price >= 100) return '#f1c40f'; // 金
    if (price >= 70) return '#c9d1d9';  // 銀
    if (price >= 40) return '#2e86de';  // 青
    return '#27ae60';                   // 緑
  }

  // 魚の種類:size=楕円の横半径, speed=px/秒, points=得点, coins=もらえるコイン,
  // damage=すくった時のポイへのダメージ, shy=ポイから逃げる度合い(0〜),
  // tier=すくうのに必要なポイの格(0:緑 1:青 2:銀 3:金)。格上の魚をすくうとポイが即破れる
  const FISH_TYPES = [
    { name: 'マンボウ', size: 46, speed: 35,  points: 10,  coins: 10, damage: 16, color: '#5dade2', belly: '#aed6f1', weight: 4,   shape: 'round',  shy: 0.3, tier: 0 },
    { name: 'タイ',     size: 32, speed: 70,  points: 30,  coins: 12,  damage: 9,  color: '#58d68d', belly: '#abebc6', weight: 4,   shape: 'normal', shy: 0.6, tier: 0 },
    { name: 'アジ',     size: 21, speed: 120, points: 60,  coins: 15,  damage: 10, color: '#f5b041', belly: '#fad7a0', weight: 3,   shape: 'normal', shy: 0.8, tier: 1 },
    { name: 'デメキン', size: 17, speed: 95,  points: 80,  coins: 21, damage: 11, color: '#2d3436', belly: '#636e72', weight: 2,   shape: 'round',  shy: 0.5, bigEyes: true, tier: 1 },
    { name: 'キンギョ', size: 13, speed: 190, points: 100, coins: 24, damage: 13, color: '#ec407a', belly: '#f8bbd0', weight: 2,   shape: 'slim',   shy: 1.0, tier: 2 },
    { name: '金のキンギョ', size: 15, speed: 420, points: 500, coins: 120, damage: 14, color: '#f1c40f', belly: '#fff3b0', weight: 0.9, shape: 'slim', shy: 1.2, rare: true, tier: 3 },
  ];

  // ===== 要素 =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const gaugeEl = document.getElementById('gauge');
  const gaugeFill = document.getElementById('gaugeFill');
  const durabilityEl = document.getElementById('durability');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const coinsEl = document.getElementById('coins');
  const walletEl = document.getElementById('walletCoins');
  const startBtn = document.getElementById('startBtn');
  const poiPicker = document.getElementById('poiPicker');
  const poiBtn = document.getElementById('poiBtn');
  const palette = document.getElementById('palette');
  const paletteRow = document.getElementById('paletteRow');
  const pauseBtn = document.getElementById('pauseBtn');
  const pauseScreen = document.getElementById('pauseScreen');

  let W = 0, H = 0, dpr = 1, scale = 1;
  let fishes = [], splashes = [], popups = [], bubbles = [];
  let durability = 100, score = 0;
  // price=今使っているポイの値段, selPrice=選択中(次に買う)ポイの値段
  let coins = loadCoins(), price = POI_PRICES[0], selPrice = loadSelPrice(), roundCoins = 0, dmgMul = 1;
  let goldTimer = 8 + Math.random() * 7; // 最初の訪問は早め
  let inGame = false; // 最初のポイを買ってからコインが尽きる(やめる)までが1ゲーム
  let state = 'title'; // title | wait | playing | ending | between(次のポイ選択中) | over
  let endTimer = 0;
  let lastTime = performance.now();

  // ポイの状態(長押し中のみ表示)
  // pending=長押し待ち(まだポイは出ていない) / active=ポイを出している / overCancel=キャンセル場所の上
  const poi = { active: false, pending: false, overCancel: false, x: 0, y: 0, pointerId: null, holdStart: 0, holdTimer: null };
  const HOLD_MS = 300; // この時間押し続けるとポイが出る

  function poiRadius() { return POI_BASE_RADIUS * scale; }

  // ===== リサイズ(レスポンシブ) =====
  function resize() {
    const vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 画面の小さい端末では魚もポイも少し小さく
    scale = Math.max(0.65, Math.min(1.25, Math.min(W, H) / 650));
    for (const f of fishes) {
      f.x = Math.min(Math.max(f.x, 0), W);
      f.y = Math.min(Math.max(f.y, topMargin()), H);
    }
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  function topMargin() { return 50; }

  // ===== 魚 =====
  function pickType() {
    const total = FISH_TYPES.reduce((s, t) => s + t.weight, 0);
    let r = Math.random() * total;
    for (const t of FISH_TYPES) { if ((r -= t.weight) < 0) return t; }
    return FISH_TYPES[0];
  }

  function createFish(fromEdge, forcedType) {
    const type = forcedType || pickType();
    const rx = type.size * scale;
    let x, y;
    const top = topMargin() + rx;
    if (fromEdge) {
      // 画面外の左右から入ってくる
      const left = Math.random() < 0.5;
      x = left ? -rx * 2 : W + rx * 2;
      y = top + Math.random() * Math.max(10, H - top - rx);
    } else {
      x = rx + Math.random() * Math.max(10, W - rx * 2);
      y = top + Math.random() * Math.max(10, H - top - rx);
    }
    let angle = Math.random() * Math.PI * 2;
    if (fromEdge) angle = (x < 0 ? 0 : Math.PI) + (Math.random() - 0.5) * 0.8;
    return {
      type, x, y, angle,
      targetAngle: angle,
      speedMul: 0.8 + Math.random() * 0.4,
      turnTimer: 1 + Math.random() * 3,
      wiggle: Math.random() * Math.PI * 2,
      boost: 1,
      entering: fromEdge,
      // レア魚はしばらく泳いだら画面の外へ去っていく
      stay: type.rare ? GOLD_STAY_MIN + Math.random() * GOLD_STAY_RAND : Infinity,
      leaving: false,
    };
  }

  function updateFish(f, dt) {
    const t = f.type;
    const rx = t.size * scale;
    f.stay -= dt;
    if (f.stay <= 0 && !f.leaving) {
      f.leaving = true;
      f.exitAngle = f.x < W / 2 ? Math.PI : 0; // 近い方の横から去る
    }
    f.turnTimer -= dt;
    if (f.turnTimer <= 0) {
      f.targetAngle = f.angle + (Math.random() - 0.5) * Math.PI * 1.2;
      f.turnTimer = 1.2 + Math.random() * 3;
    }
    // ポイが近いと反対方向へ逃げる(臆病な魚ほど遠くから・速く逃げる)
    let fleeing = false;
    if (poi.active && state === 'playing') {
      const dx = f.x - poi.x, dy = f.y - poi.y;
      const fleeR = poiRadius() * (1.2 + 0.8 * t.shy);
      if (dx * dx + dy * dy < fleeR * fleeR) {
        f.targetAngle = Math.atan2(dy, dx);
        fleeing = true;
      }
    }
    f.boost += ((fleeing ? 1 + 1.6 * t.shy : 1) - f.boost) * Math.min(1, dt * 8);
    // 画面端に近づいたら中央方向へ向きを変える
    const margin = rx * 1.5;
    const top = topMargin() + rx * 0.6;
    if (f.leaving) {
      f.targetAngle = f.exitAngle;
      if (f.x < -rx * 3 || f.x > W + rx * 3) f.gone = true;
    } else if (!f.entering) {
      if (f.x < margin || f.x > W - margin || f.y < top || f.y > H - rx * 0.6) {
        const cx = W / 2 + (Math.random() - 0.5) * W * 0.4;
        const cy = (top + H) / 2 + (Math.random() - 0.5) * H * 0.3;
        f.targetAngle = Math.atan2(cy - f.y, cx - f.x);
      }
    } else if (f.x > margin && f.x < W - margin) {
      f.entering = false;
    }
    // なめらかに旋回
    let diff = f.targetAngle - f.angle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    const turnRate = (1.2 + t.speed / 80) * (fleeing ? 2 : 1); // 逃げる時は素早く向きを変える
    f.angle += Math.max(-turnRate * dt, Math.min(turnRate * dt, diff));

    const sp = t.speed * f.speedMul * f.boost * scale;
    f.x += Math.cos(f.angle) * sp * dt;
    f.y += Math.sin(f.angle) * sp * dt;
    f.wiggle += dt * (4 + t.speed / 25) * f.boost;

    // 念のため画面外に出すぎないよう制限
    if (!f.entering && !f.leaving) {
      f.x = Math.min(Math.max(f.x, -rx), W + rx);
      f.y = Math.min(Math.max(f.y, topMargin()), H + rx * 0.3);
    }
  }

  function drawFishShape(c, type, rx, wiggle) {
    const ry = rx * (type.shape === 'round' ? 0.72 : type.shape === 'slim' ? 0.5 : 0.55);
    const tailSwing = Math.sin(wiggle) * ry * 0.35;
    // 尾びれ(三角)
    c.fillStyle = type.color;
    c.beginPath();
    c.moveTo(-rx * 0.8, 0);
    c.lineTo(-rx * 1.55, -ry * 0.9 + tailSwing);
    c.lineTo(-rx * 1.55, ry * 0.9 + tailSwing);
    c.closePath();
    c.fill();
    // 背びれ(三角)
    c.beginPath();
    c.moveTo(-rx * 0.35, -ry * 0.85);
    c.lineTo(rx * 0.05, -ry * 1.35);
    c.lineTo(rx * 0.3, -ry * 0.85);
    c.closePath();
    c.fill();
    // 体(楕円)
    const g = c.createLinearGradient(0, -ry, 0, ry);
    g.addColorStop(0, type.color);
    g.addColorStop(1, type.belly);
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.18)';
    c.lineWidth = Math.max(1, rx * 0.05);
    c.stroke();
    // えら
    c.beginPath();
    c.arc(rx * 0.35, 0, ry * 0.6, -0.9, 0.9);
    c.stroke();
    // 目(デメキンは飛び出た大きな目)
    const eyeX = type.bigEyes ? rx * 0.72 : rx * 0.6;
    const eyeY = type.bigEyes ? -ry * 0.55 : -ry * 0.2;
    const eyeR = type.bigEyes ? ry * 0.42 : Math.max(2, ry * 0.22);
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
    c.fill();
    if (type.bigEyes) c.stroke();
    c.fillStyle = '#111';
    c.beginPath();
    c.arc(eyeX + eyeR * 0.25, eyeY, Math.max(1.2, eyeR * 0.55), 0, Math.PI * 2);
    c.fill();
  }

  function drawFish(f, now) {
    const rx = f.type.size * scale;
    if (f.type.rare) {
      // レア魚はキラキラ光る
      ctx.save();
      const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rx * 2.4);
      glow.addColorStop(0, `rgba(255, 236, 120, ${0.45 + 0.2 * Math.sin(now / 150)})`);
      glow.addColorStop(1, 'rgba(255, 236, 120, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(f.x, f.y, rx * 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 3; i++) {
        const a = now / 400 + i * 2.1;
        const s = 1.5 + Math.abs(Math.sin(now / 200 + i)) * 2;
        ctx.fillRect(f.x + Math.cos(a) * rx * 1.6 - s / 2, f.y + Math.sin(a) * rx * 1.2 - s / 2, s, s);
      }
      ctx.restore();
    }
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.angle);
    if (Math.cos(f.angle) < 0) ctx.scale(1, -1); // 背中が上になるよう反転
    drawFishShape(ctx, f.type, rx, f.wiggle);
    ctx.restore();
  }

  // すくい判定:魚の中心がポイの円内にあれば捕獲
  function inPoi(f, px, py, r) {
    const dx = f.x - px, dy = f.y - py;
    return dx * dx + dy * dy <= r * r;
  }

  // ===== 背景の泡 =====
  function initBubbles() {
    bubbles = [];
    const n = Math.round((W * H) / 25000) + 10;
    for (let i = 0; i < n; i++) {
      bubbles.push({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 3.5, v: 15 + Math.random() * 35, p: Math.random() * 6 });
    }
  }

  function drawBackground(time) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1e90c8');
    g.addColorStop(0.55, '#0a5a8c');
    g.addColorStop(1, '#06304f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 光のゆらぎ
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 5; i++) {
      const x = ((i + 0.5) / 5) * W + Math.sin(time / 1500 + i) * 40;
      ctx.beginPath();
      ctx.moveTo(x - 20, 0);
      ctx.lineTo(x + 30, 0);
      ctx.lineTo(x + 120, H);
      ctx.lineTo(x - 60, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // 底の砂
    ctx.fillStyle = '#c8a86b';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - 14 - Math.sin(x / 60) * 6);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // 泡
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (const b of bubbles) {
      ctx.beginPath();
      ctx.arc(b.x + Math.sin(time / 700 + b.p) * 4, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function updateBubbles(dt) {
    for (const b of bubbles) {
      b.y -= b.v * dt;
      if (b.y < -5) { b.y = H + 5; b.x = Math.random() * W; }
    }
  }

  // ===== ポイ =====
  function drawPoi(now) {
    if (poi.pending) {
      // 長押し中:ポイが出るまでのゲージ
      const k = Math.min(1, (now - poi.holdStart) / HOLD_MS);
      ctx.save();
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.arc(poi.x, poi.y, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = poiColor(price);
      ctx.beginPath(); ctx.arc(poi.x, poi.y, 22, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); ctx.stroke();
      ctx.restore();
      return;
    }
    if (!poi.active) return;
    if (poi.overCancel) ctx.globalAlpha = 0.45; // キャンセル場所の上では薄く
    const r = poiRadius();
    const x = poi.x, y = poi.y;
    const rate = durability / 100;

    ctx.save();
    // 持ち手(右下に伸びる)
    const ang = Math.PI / 4;
    const hx = x + Math.cos(ang) * r, hy = y + Math.sin(ang) * r;
    ctx.strokeStyle = poiColor(price);
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(8, r * 0.2);
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx + Math.cos(ang) * r * 1.4, hy + Math.sin(ang) * r * 1.4);
    ctx.stroke();

    // 和紙(耐久度が下がるほど透けて灰色っぽく)
    ctx.fillStyle = `rgba(${Math.round(220 + 35 * rate)}, ${Math.round(220 + 35 * rate)}, ${Math.round(225 + 30 * rate)}, ${0.25 + 0.3 * rate})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // 破れかけのひび(耐久度が低いほど多い)
    const cracks = rate < 0.25 ? 4 : rate < 0.5 ? 2 : rate < 0.75 ? 1 : 0;
    ctx.strokeStyle = 'rgba(40, 60, 80, .55)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < cracks; i++) {
      const a = i * 2.1 + 0.4;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r * 0.9, y + Math.sin(a) * r * 0.9);
      ctx.lineTo(x + Math.cos(a + 0.35) * r * 0.45, y + Math.sin(a + 0.35) * r * 0.45);
      ctx.lineTo(x + Math.cos(a - 0.2) * r * 0.15, y + Math.sin(a - 0.2) * r * 0.15);
      ctx.stroke();
    }

    // 枠
    ctx.strokeStyle = poiColor(price);
    ctx.lineWidth = Math.max(4, r * 0.1);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();

    // 範囲内の魚をハイライト(すくえる目安)
    ctx.strokeStyle = `rgba(255, 255, 120, ${0.6 + 0.3 * Math.sin(now / 120)})`;
    ctx.lineWidth = 2;
    for (const f of fishes) {
      if (inPoi(f, x, y, r)) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.type.size * scale * 0.9, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function scoop(x, y) {
    if (state !== 'playing') return;
    const r = poiRadius();
    const inside = fishes.filter(f => inPoi(f, x, y, r));

    // 格上の魚が入っていたらポイが即破れ、全部逃げる
    const tooGood = inside.filter(f => f.type.tier > poiTier(price));
    if (tooGood.length) {
      for (const f of inside) {
        f.targetAngle = Math.atan2(f.y - y, f.x - x);
        f.boost = 2.5;
      }
      const best = tooGood.reduce((a, b) => (b.type.tier > a.type.tier ? b : a));
      durability = 0;
      splashes.push({ x, y, r, life: 1 });
      popups.push({ x, y: y - r - 10, text: `${best.type.name}には弱すぎた!`, life: 1.4, color: '#ff7675' });
      sfx.miss();
      updateHud();
      breakPoi();
      return;
    }

    const caught = inside;
    fishes = fishes.filter(f => !caught.includes(f));

    let damage = SCOOP_WEAR;
    let gained = 0, gotCoins = 0;
    for (const f of caught) {
      damage += f.type.damage;
      gained += f.type.points;
      gotCoins += f.type.coins;
      popups.push({ x: f.x, y: f.y, text: `+${f.type.points} 🪙${f.type.coins}`, life: 1, color: f.type.rare ? '#ffd32a' : null });
      if (f.type.rare) popups.push({ x: f.x, y: f.y - 34, text: '✨大当たり!', life: 1.4, color: '#ffd32a' });
      setTimeout(() => { if (inGame) fishes.push(createFish(true)); }, 800);
    }
    // 複数匹まとめてすくうとボーナス
    if (caught.length >= 2) {
      const bonus = Math.round(gained * 0.2 * (caught.length - 1));
      gained += bonus;
      popups.push({ x, y: y - r - 10, text: `${caught.length}匹まとめて! +${bonus}`, life: 1.3, color: '#ffd32a' });
    } else if (caught.length === 0) {
      popups.push({ x, y, text: 'からぶり!', life: 1.2, color: '#ff7675' });
    }
    score += gained;
    roundCoins += gotCoins;
    coins += gotCoins;
    saveCoins();
    damage = caught.length === 0 ? MISS_DAMAGE : Math.max(1, Math.round(damage * dmgMul));
    durability = Math.max(0, durability - damage);

    splashes.push({ x, y, r, life: 1 });
    if (caught.length) popups.push({ x, y: y + r + 16, text: `ポイ -${damage}%`, life: 0.9, small: true, color: '#ff7675' });
    gaugeEl.classList.remove('shake');
    void gaugeEl.offsetWidth; // アニメーションを再生し直す
    gaugeEl.classList.add('shake');
    vibrate(caught.length ? 40 : 15);
    if (caught.length === 0) sfx.miss();
    else if (caught.some(f => f.type.rare)) sfx.rare();
    else sfx.catch(caught.length);
    updateHud();

    if (durability <= 0) breakPoi();
  }

  function breakPoi() {
    state = 'ending';
    endTimer = 1.0;
    vibrate([80, 60, 120]);
    sfx.rip();
    popups.push({ x: W / 2, y: H / 2, text: 'ビリッ!', life: 1.2, color: '#ff7675', big: true });
  }

  const VIBE_KEY = 'fishHunterVibe';
  let vibeOn = true;
  try { vibeOn = localStorage.getItem(VIBE_KEY) !== '0'; } catch (e) {}
  function vibrate(p) { if (!vibeOn) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // ===== 効果音(Web Audioで合成。音声ファイル不要) =====
  const MUTE_KEY = 'fishHunterMuted';
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
  let actx = null;
  let noiseBuf = null;

  function audio() {
    if (muted) return null;
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  // 単音:freq→toの周波数へ滑らせる
  function tone(freq, dur, { type = 'sine', vol = 0.18, to = null, delay = 0 } = {}) {
    const c = audio(); if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  // ノイズ:水しぶき・紙が破れる音など
  function noise(dur, { vol = 0.2, freq = 1200, to = null, q = 1, type = 'bandpass', delay = 0 } = {}) {
    const c = audio(); if (!c) return;
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + delay;
    const src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
    src.buffer = noiseBuf;
    flt.type = type; flt.Q.value = q;
    flt.frequency.setValueAtTime(freq, t0);
    if (to) flt.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt).connect(g).connect(c.destination);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
  }

  const sfx = {
    // ポイを水に入れる「ちゃぽん」
    dip() { noise(0.12, { vol: 0.12, freq: 900, to: 400 }); tone(500, 0.1, { to: 900, vol: 0.06 }); },
    // すくえた「ぱしゃっ+ポン」(まとめてすくうほど音が上がる)
    catch(n) {
      noise(0.2, { vol: 0.18, freq: 1500, to: 500 });
      const notes = [660, 880, 1047, 1319, 1568];
      for (let i = 0; i < Math.min(n, notes.length); i++) tone(notes[i], 0.18, { type: 'triangle', vol: 0.16, delay: 0.05 + i * 0.07 });
    },
    // 金のキンギョ「キラキラ」
    rare() {
      noise(0.2, { vol: 0.18, freq: 1500, to: 500 });
      [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.3, { type: 'triangle', vol: 0.14, delay: 0.05 + i * 0.06 }));
    },
    // からぶり「ぼちゃん」
    miss() { noise(0.3, { vol: 0.2, freq: 700, to: 150 }); tone(220, 0.25, { to: 90, vol: 0.12 }); },
    // ポイが破れた「ビリッ」
    rip() {
      noise(0.08, { vol: 0.35, freq: 3000, q: 0.7, type: 'highpass' });
      noise(0.25, { vol: 0.3, freq: 2500, to: 600, q: 0.8, delay: 0.07 });
      tone(300, 0.5, { type: 'sawtooth', to: 80, vol: 0.06, delay: 0.1 });
    },
    // コインを払う「チャリン」
    coin() { tone(1976, 0.12, { type: 'square', vol: 0.06 }); tone(2637, 0.3, { type: 'square', vol: 0.06, delay: 0.08 }); },
    // ボタン
    click() { tone(880, 0.06, { type: 'triangle', vol: 0.1 }); },
    // コインがなくなった
    broke() { [392, 330, 262].forEach((f, i) => tone(f, 0.35, { type: 'triangle', vol: 0.14, delay: i * 0.22 })); },
  };


  function drawSplashes(dt) {
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.life -= dt * 1.8;
      if (s.life <= 0) { splashes.splice(i, 1); continue; }
      const k = 1 - s.life;
      ctx.strokeStyle = `rgba(255,255,255,${s.life * 0.8})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (1 + k * 0.6), 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (0.6 + k * 0.8), 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawPopups(dt) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.life -= dt;
      p.y -= 40 * dt;
      if (p.life <= 0) { popups.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life * 1.5);
      ctx.font = `bold ${p.big ? 56 : p.small ? 16 : 26}px sans-serif`;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,.6)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color || '#fff';
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }

  // ===== HUD =====
  function updateHud() {
    scoreEl.textContent = score;
    coinsEl.textContent = coins;
    durabilityEl.textContent = Math.round(durability) + '%';
    gaugeFill.style.width = durability + '%';
    gaugeFill.style.backgroundColor = durability > 60 ? '#2ecc71' : durability > 30 ? '#f1c40f' : '#e74c3c';
  }

  // ===== ゲーム進行 =====
  function populate() {
    fishes = [];
    for (let i = 0; i < FISH_COUNT; i++) fishes.push(createFish(false));
    // 大きい魚が奥になるよう並べ替え
    fishes.sort((a, b) => b.type.size - a.type.size);
  }

  // ===== コイン・ポイ購入 =====
  function loadCoins() {
    try {
      const v = localStorage.getItem(COINS_KEY);
      if (v !== null && !isNaN(Number(v))) return Math.max(0, Math.floor(Number(v)));
    } catch (e) {}
    return START_COINS;
  }
  function saveCoins() { try { localStorage.setItem(COINS_KEY, String(coins)); } catch (e) {} }

  function loadSelPrice() {
    try {
      const v = Number(localStorage.getItem(SEL_KEY));
      if (POI_PRICES.includes(v)) return v;
      if (v >= PRICE_MIN) return POI_PRICES[poiTier(v)]; // 旧10段階の値段は同じ色のポイへ
    } catch (e) {}
    return POI_PRICES[0]; // 初期は緑(10)のポイ
  }
  function loadBest() {
    try { return Number(localStorage.getItem('fishHunterPoiBest') || 0); } catch (e) { return 0; }
  }
  // 手持ちで買える範囲に下げた値段(0ならもう買えない)
  function affordable(p) {
    const ok = POI_PRICES.filter(q => q <= p && q <= coins);
    return ok.length ? ok[ok.length - 1] : 0;
  }

  // ===== ポイ選択(画面下のアイコン) =====
  function poiSvg(color) {
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><line x1="25" y1="25" x2="36" y2="36" stroke="${color}" stroke-width="5" stroke-linecap="round"/>` +
      `<circle cx="17" cy="17" r="12" fill="rgba(255,255,255,.6)" stroke="${color}" stroke-width="4"/></svg>`;
  }
  let paletteOpen = false;
  function buildPalette() {
    for (const p of POI_PRICES) {
      const d = document.createElement('div');
      d.className = 'poiOpt';
      d.dataset.price = p;
      d.innerHTML = poiSvg(poiColor(p)) + `${TIER_NAMES[poiTier(p)]} 🪙${p}`;
      paletteRow.appendChild(d);
    }
  }
  // 耐久度100%(まだ使っていない)ポイは、代金を返してすぐ別のポイに交換できる
  function canSwap() {
    return inGame && durability >= 100 && (state === 'playing' || state === 'wait');
  }
  function updatePicker() {
    document.getElementById('poiBtnIcon').innerHTML = poiSvg(poiColor(selPrice));
    document.getElementById('poiBtnPrice').textContent = '🪙' + selPrice;
    const swap = canSwap();
    const budget = swap ? coins + price : coins;
    document.getElementById('paletteHead').textContent = swap ? 'ポイを交換(未使用なので今すぐ)' : '次のポイを選ぶ';
    for (const d of paletteRow.children) {
      const p = Number(d.dataset.price);
      d.classList.toggle('sel', p === selPrice);
      d.classList.toggle('cant', p > budget);
    }
  }
  function openPalette() {
    if (!inGame || state === 'paused') return;
    updatePicker();
    palette.hidden = false;
    paletteOpen = true;
    sfx.click();
  }
  function closePalette() {
    palette.hidden = true;
    paletteOpen = false;
    setHover(null);
  }
  function optAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('.poiOpt') : null;
  }
  function setHover(opt) {
    for (const d of paletteRow.children) d.classList.toggle('hover', d === opt);
  }
  function selectPrice(p) {
    const changed = p !== selPrice;
    selPrice = p;
    try { localStorage.setItem(SEL_KEY, String(p)); } catch (e) {}
    closePalette();
    if (canSwap() && p !== price && coins + price >= p) {
      // 未使用のポイを返品して、選んだポイに今すぐ交換
      coins += price;
      buyPoi(p);
      popups.push({ x: W / 2, y: H - 150, text: `ポイを交換 🪙${p}`, life: 1.3, color: poiColor(p) });
      return;
    }
    updatePicker();
    sfx.click();
    if (changed && inGame) popups.push({ x: W / 2, y: H - 150, text: `次のポイ:🪙${p}`, life: 1.3, color: poiColor(p) });
  }
  function showInGameUi(show) {
    poiPicker.hidden = !show;
    pauseBtn.hidden = !show;
    if (!show) closePalette();
  }

  // ===== 画面遷移 =====
  function showTitle() {
    state = 'title';
    if (coins < PRICE_MIN) { showBroke(); return; }
    walletEl.textContent = coins;
    document.getElementById('titlePoi').innerHTML = poiSvg(poiColor(selPrice)) + ' 🪙' + selPrice;
    showInGameUi(false);
    endScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
  }

  // 起動時にコインがない場合
  function showBroke() {
    state = 'over';
    document.getElementById('endTitle').textContent = 'コインがなくなりました';
    document.getElementById('scoreBlock').hidden = true;
    bestScoreEl.textContent = 'ハイスコア:' + loadBest();
    document.getElementById('endWallet').textContent = '';
    document.getElementById('retryBtn').textContent = `🪙${START_COINS}で最初から`;
    showInGameUi(false);
    startScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');
  }

  function startGame() {
    if (affordable(selPrice) < PRICE_MIN) { showBroke(); return; }
    inGame = true;
    score = 0;
    populate();
    goldTimer = 8 + Math.random() * 7;
    splashes = []; popups = [];
    startScreen.classList.add('hidden');
    showInGameUi(true);
    buyPoi(affordable(selPrice));
  }

  function buyPoi(p) {
    price = p;
    coins -= p;
    sfx.coin();
    saveCoins();
    dmgMul = damageMul(p);
    roundCoins = 0;
    durability = 100;
    resetPoi();
    updateHud();
    updatePicker();
    // ボタンのタップがそのままポイ操作にならないよう少し待つ
    state = 'wait';
    setTimeout(() => { if (state === 'wait') state = 'playing'; }, 150);
  }

  // ポイが破れた → 選択中のポイを自動で買って続行
  function poiBroken() {
    resetPoi();
    const net = roundCoins - price;
    popups.push({ x: W / 2, y: H / 2 + 60, text: `このポイの収支 ${net >= 0 ? '+' : ''}${net}`, life: 1.8, small: true, color: net >= 0 ? '#ffd32a' : '#fff' });
    const p = affordable(selPrice);
    if (p < PRICE_MIN) { sfx.broke(); finishGame(true); return; }
    buyPoi(p);
    popups.push({ x: W / 2, y: H / 2 + 20, text: `新しいポイ 🪙${p}`, life: 1.6, color: poiColor(p) });
    if (p < selPrice) popups.push({ x: W / 2, y: H / 2 + 90, text: 'コイン不足のため安いポイにしました', life: 2, small: true, color: '#ff7675' });
  }

  function finishGame(broke) {
    inGame = false;
    state = 'over';
    resetPoi();
    showInGameUi(false);
    pauseScreen.classList.add('hidden');
    let best = loadBest();
    if (score > best) {
      best = score;
      try { localStorage.setItem('fishHunterPoiBest', String(best)); } catch (e) {}
      bestScoreEl.textContent = '🎉 ハイスコア更新!';
    } else {
      bestScoreEl.textContent = 'ハイスコア:' + best;
    }
    document.getElementById('endTitle').textContent = broke ? 'コインがなくなりました' : 'ゲーム終了';
    document.getElementById('scoreBlock').hidden = false;
    finalScoreEl.textContent = score;
    document.getElementById('endWallet').textContent = broke ? '' : `手持ち 🪙${coins}`;
    document.getElementById('retryBtn').textContent = broke ? `🪙${START_COINS}で最初から` : '新しいゲーム';
    endScreen.classList.remove('hidden');
  }

  function retry() {
    if (coins < PRICE_MIN) {
      coins = START_COINS;
      saveCoins();
      sfx.coin();
    } else {
      sfx.click();
    }
    score = 0;
    durability = 100;
    updateHud();
    showTitle();
  }

  // ===== ポーズ =====
  let stateBeforePause = 'playing';
  function pauseGame() {
    if (!inGame || state === 'paused') return;
    stateBeforePause = state === 'ending' ? 'ending' : 'playing';
    state = 'paused';
    resetPoi();
    showInGameUi(false);
    updateSettings();
    pauseScreen.classList.remove('hidden');
    sfx.click();
  }
  function resumeGame() {
    pauseScreen.classList.add('hidden');
    showInGameUi(true);
    sfx.click();
    // 再開ボタンのタップがポイ操作にならないよう少し待つ
    state = 'wait';
    setTimeout(() => { if (state === 'wait') state = stateBeforePause; }, 150);
  }
  function updateSettings() {
    const snd = document.getElementById('soundToggle'), vib = document.getElementById('vibeToggle');
    snd.textContent = muted ? 'オフ' : 'オン';
    snd.classList.toggle('off', muted);
    vib.textContent = vibeOn ? 'オン' : 'オフ';
    vib.classList.toggle('off', !vibeOn);
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    const sdt = state === 'paused' ? 0 : dt; // ポーズ中は時間を止める
    updateBubbles(sdt);
    for (const f of fishes) updateFish(f, sdt);
    if (fishes.some(f => f.gone)) {
      fishes = fishes.filter(f => !f.gone);
      while (fishes.length < FISH_COUNT) fishes.push(createFish(true));
    }
    goldTimer -= sdt;
    if (goldTimer <= 0) {
      goldTimer = GOLD_VISIT_MIN + Math.random() * GOLD_VISIT_RAND;
      if (!fishes.some(f => f.type.rare)) fishes.push(createFish(true, FISH_TYPES.find(t => t.rare)));
    }

    drawBackground(now);
    for (const f of fishes) drawFish(f, now);
    drawSplashes(sdt);
    drawPoi(now);
    drawPopups(sdt);

    if (state === 'ending') {
      endTimer -= dt;
      if (endTimer <= 0) poiBroken();
    }
    requestAnimationFrame(loop);
  }

  // ===== 入力(マウス・タッチ共通) =====
  // 押す → ポイ表示 / 動かす → 追従 / 離す → すくう / キャンセル → すくわずに消す
  function localPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  // 押す → 長押し待ち(HOLD_MS) → ポイ表示 / 動かす → 追従 / 離す → すくう
  // 長押し前に離す → 何もしない / キャンセル場所(画面下のアイコン)で離す → すくわずに消す
  function resetPoi() {
    clearTimeout(poi.holdTimer);
    poi.active = poi.pending = poi.overCancel = false;
    poi.pointerId = null;
    canvas.classList.remove('holding');
    poiPicker.classList.remove('cancelMode', 'overCancel');
  }
  function pressStart(e, id) {
    if (state !== 'playing' || poi.active || poi.pending) return;
    const p = localPos(e);
    poi.pending = true;
    poi.pointerId = id;
    poi.x = p.x; poi.y = p.y;
    poi.holdStart = performance.now();
    poi.holdTimer = setTimeout(() => {
      if (!poi.pending || state !== 'playing') return;
      poi.pending = false;
      poi.active = true;
      canvas.classList.add('holding');
      closePalette();
      poiPicker.classList.add('cancelMode');
      sfx.dip();
      vibrate(10);
    }, HOLD_MS);
  }
  function overCancelZone(e) {
    const r = poiBtn.getBoundingClientRect();
    const m = 16; // 少し広めに判定
    return e.clientX >= r.left - m && e.clientX <= r.right + m && e.clientY >= r.top - m && e.clientY <= r.bottom + m;
  }
  function pressMove(e, id) {
    if (!(poi.active || poi.pending) || poi.pointerId !== id) return;
    const p = localPos(e);
    poi.x = p.x; poi.y = p.y;
    if (poi.active) {
      poi.overCancel = overCancelZone(e);
      poiPicker.classList.toggle('overCancel', poi.overCancel);
    }
  }
  function pressEnd(e, id, cancelled) {
    if (!(poi.active || poi.pending) || poi.pointerId !== id) return;
    const wasActive = poi.active;
    if (e) {
      const p = localPos(e); poi.x = p.x; poi.y = p.y;
      if (wasActive) poi.overCancel = overCancelZone(e);
    }
    const dropOnCancel = poi.overCancel;
    const x = poi.x, y = poi.y;
    resetPoi();
    if (!wasActive || cancelled) return; // 長押し前に離した
    if (dropOnCancel) {
      popups.push({ x, y: y - 30, text: 'キャンセル', life: 0.8, small: true });
      sfx.click();
      return;
    }
    scoop(x, y);
  }

  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (paletteOpen) { closePalette(); return; } // 選択を開いている時は閉じるだけ
      if (e.button !== undefined && e.button > 0) return; // 左クリック/タッチのみ
      pressStart(e, e.pointerId);
      if (poi.pointerId === e.pointerId) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    }, { passive: false });
    canvas.addEventListener('pointermove', (e) => { e.preventDefault(); pressMove(e, e.pointerId); }, { passive: false });
    canvas.addEventListener('pointerup', (e) => { e.preventDefault(); pressEnd(e, e.pointerId, false); }, { passive: false });
    canvas.addEventListener('pointercancel', (e) => pressEnd(null, e.pointerId, true));
  } else {
    // 古いブラウザ向けフォールバック
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.changedTouches[0]; pressStart(t, t.identifier); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); for (const t of e.changedTouches) pressMove(t, t.identifier); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); for (const t of e.changedTouches) pressEnd(t, t.identifier, false); }, { passive: false });
    canvas.addEventListener('touchcancel', (e) => { for (const t of e.changedTouches) pressEnd(null, t.identifier, true); });
    canvas.addEventListener('mousedown', (e) => pressStart(e, 'mouse'));
    window.addEventListener('mousemove', (e) => pressMove(e, 'mouse'));
    window.addEventListener('mouseup', (e) => pressEnd(e, 'mouse', false));
  }

  // スクロール・ズーム・長押しメニューを防止
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  startBtn.addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', retry);
  pauseBtn.addEventListener('click', pauseGame);
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);
  document.getElementById('quitBtn').addEventListener('click', () => { sfx.click(); finishGame(false); });
  document.getElementById('soundToggle').addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
    updateSettings();
    sfx.click();
  });
  document.getElementById('vibeToggle').addEventListener('click', () => {
    vibeOn = !vibeOn;
    try { localStorage.setItem(VIBE_KEY, vibeOn ? '1' : '0'); } catch (e) {}
    updateSettings();
    sfx.click();
    vibrate(30);
  });

  // ポイアイコン:
  //  PC … 右クリック(または左クリック)で開き、クリックで選ぶ
  //  スマホ … 長押しで開き、指を離さずスライドして離した所のポイを選ぶ(タップでも開閉できる)
  const LONG_PRESS_MS = 350;
  let press = null;
  poiBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (e.pointerType === 'mouse') {
      if (paletteOpen) closePalette(); else openPalette();
      return;
    }
    const wasOpen = paletteOpen;
    press = { id: e.pointerId, opened: false, wasOpen };
    press.timer = setTimeout(() => {
      if (!paletteOpen) openPalette();
      press.opened = true;
      vibrate(15);
    }, LONG_PRESS_MS);
    try { poiBtn.setPointerCapture(e.pointerId); } catch (_) {}
  });
  poiBtn.addEventListener('pointermove', (e) => {
    if (!press || press.id !== e.pointerId || !paletteOpen) return;
    setHover(optAt(e.clientX, e.clientY));
  });
  poiBtn.addEventListener('pointerup', (e) => {
    if (!press || press.id !== e.pointerId) return;
    clearTimeout(press.timer);
    const opt = paletteOpen ? optAt(e.clientX, e.clientY) : null;
    if (opt) selectPrice(Number(opt.dataset.price));
    else if (!press.opened) { if (press.wasOpen) closePalette(); else openPalette(); } // 短いタップ
    setHover(null);
    press = null;
  });
  poiBtn.addEventListener('pointercancel', () => { if (press) clearTimeout(press.timer); press = null; setHover(null); });
  palette.addEventListener('click', (e) => {
    const opt = e.target.closest('.poiOpt');
    if (opt) selectPrice(Number(opt.dataset.price));
  });
  palette.addEventListener('pointerover', (e) => { if (e.pointerType === 'mouse') setHover(e.target.closest('.poiOpt')); });
  palette.addEventListener('pointerleave', () => setHover(null));

  // ===== スタート画面の凡例 =====
  function buildLegend() {
    const ul = document.getElementById('legend');
    for (const t of FISH_TYPES) {
      const li = document.createElement('li');
      const c = document.createElement('canvas');
      const r = window.devicePixelRatio || 1;
      c.width = 48 * r; c.height = 28 * r;
      const cc = c.getContext('2d');
      cc.scale(r, r);
      cc.translate(28, 15);
      const rx = 6 + t.size / 46 * 10;
      drawFishShape(cc, t, rx, 0);
      li.appendChild(c);
      const speed = t.speed < 50 ? 'おそい' : t.speed < 100 ? 'ふつう' : t.speed < 150 ? 'はやい' : 'とてもはやい';
      const span = document.createElement('span');
      span.innerHTML = `${t.rare ? '✨' : ''}${t.name}(${speed}):${t.points}点 🪙${t.coins}` +
        `<br><span class="need">${poiSvg(poiColor(POI_PRICES[t.tier]))}${TIER_NAMES[t.tier]}${t.tier < 3 ? '以上' : ''}のポイ</span>`;
      li.appendChild(span);
      ul.appendChild(li);
    }
  }

  // ===== 初期化 =====
  resize();
  initBubbles();
  buildLegend();
  buildPalette();
  updatePicker();
  populate();
  updateHud();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>

</body></html>
